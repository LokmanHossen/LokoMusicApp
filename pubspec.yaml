name: pulse_music
description: Pulse - a music streaming app powered by the Audius API.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  go_router: ^14.6.2
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/splash_screen.png

# ---- Branding (Loko Music) -------------------------------------------------
# Icons and splash images are built from assets/branding/logo.png by
# tool/branding/generate_branding_test.dart. Regenerate with:
#   flutter test tool/branding/generate_branding_test.dart
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# The in-app splash artwork is assets/branding/splash_screen.png (not generated).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#06065F"
  image: "assets/branding/splash.png"
  android_12:
    color: "#06065F"
    image: "assets/branding/splash_android12.png"
    icon_background_color: "#06065F"
  ios: false
  web: false
